# Builds SanskritComposerStudio-<version>.zip, starts it with each launcher on Windows, macOS and
# Linux, runs the smoke test, and (for a v* tag) attaches the zip to that tag's GitHub release.
# The databases come from the data release (DATA_RELEASE), uploaded once by hand.
name: Build, test and release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

env:
  DATA_RELEASE: data-v1
  DATA_ZIP: sanskrit-studio-data-v1.zip

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the databases
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$DATA_RELEASE" --pattern "$DATA_ZIP" --dir "$RUNNER_TEMP"
      - name: Build the package
        run: sh scripts/package.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/$DATA_ZIP"
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: dist/SanskritComposerStudio-*.zip
          compression-level: 0

  test:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: pkg
      - name: Unzip
        run: cd pkg && python -m zipfile -e SanskritComposerStudio-*.zip .
      - name: Install Ruby and sqlite3 (Linux users do the same)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ruby sqlite3
      # Start, wait and test in one step: on Windows the runner ends a step's processes when the
      # step finishes, so a server started in an earlier step would already be gone.
      - name: Start with the launcher and run the smoke test
        run: |
          cd pkg/SanskritComposerStudio-*/
          case "$RUNNER_OS" in
            # Launch the .bat the way Windows does (Git Bash would mangle its quoted name).
            Windows) powershell -NoProfile -Command 'Start-Process -FilePath (Join-Path (Get-Location) "Start Sanskrit Studio (Windows).bat") -NoNewWindow -RedirectStandardOutput server.log -RedirectStandardError server-errors.log' ;;
            macOS)   sh "Start Sanskrit Studio (Mac).command" > server.log 2>&1 & ;;
            Linux)   sh start-sanskrit-studio-linux.sh > server.log 2>&1 & ;;
          esac
          up=no
          for i in $(seq 90); do
            if curl -fs -m 10 http://127.0.0.1:4567/api/config >/dev/null; then up=yes; break; fi
            sleep 2
          done
          if [ "$up" != yes ]; then
            { echo "curl:"; curl -sv -m 10 http://127.0.0.1:4567/api/config 2>&1 | tail -15
              echo "processes:"; ps -W 2>/dev/null | grep -iE "ruby|sqlite" || ps aux | grep -iE "ruby|sqlite"; } > diagnostics.log
            exit 1
          fi
          sh "$GITHUB_WORKSPACE/scripts/smoke_test.sh" http://127.0.0.1:4567 2>&1 | tee smoke.log
          exit "${PIPESTATUS[0]}"
      - name: Server log
        if: always()
        run: |
          # Job logs need admin rights to download, so on failure the server output is also
          # reported as an error annotation, which anyone can read.
          for f in pkg/SanskritComposerStudio-*/*.log; do
            [ -f "$f" ] || continue
            echo "== $f"; cat "$f"
            if [ "${{ job.status }}" != success ]; then
              printf '::error title=%s (%s)::%s\n' "$(basename "$f")" "$RUNNER_OS" \
                "$(tail -c 4000 "$f" | awk '{gsub(/%/,"%25"); gsub(/\r/,""); printf "%s%%0A", $0}')"
            fi
          done

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: pkg
      - name: Attach the zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          sed "s/<version>/$GITHUB_REF_NAME/" .github/release-notes.md > "$RUNNER_TEMP/notes.md"
          gh release view "$GITHUB_REF_NAME" --repo "$REPO" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --repo "$REPO" --title "Sanskrit Composer Studio $GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/notes.md"
          gh release upload "$GITHUB_REF_NAME" pkg/SanskritComposerStudio-*.zip --repo "$REPO" --clobber
